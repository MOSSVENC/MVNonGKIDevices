name: build-RMX2117

# Builds a realme Q2 / RMX2117 (MT6853, MTK 4.14.186) kernel from the
# realme AndroidS common-source tree with selectable features and
# produces the kernel image + appended device tree.
#
# Produced artifacts: kernel Image and mt6853.dtb (the boot image dtb);
# the dtbo partition image is carried over from the stock firmware.

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: kernel branch/ref to build
        required: false
        default: master
      root_mode:
        description: "root manager & hook mode: see README section \"root_mode\""
        type: choice
        options:
          - resukisu-manual-lsm
          - resukisu-manual-source
          - resukisu-auto
          - resukisu-susfs
          - xxksu-syscall_table
          - xxksu-branch_link
          - none
        default: resukisu-manual-lsm
      enable_bbg:
        description: integrate Baseband-guard (BBG, upstream setup.sh)
        type: boolean
        default: false
      enable_droidspace:
        description: enable Droidspaces/LXC kernel support (4.14 cgroup prefix patch + config)
        type: boolean
        default: false
      auto_fix_49:
        description: "4.x auto-hook kasan_reset_tag guard fix (resukisu-auto)"
        type: boolean
        default: true
concurrency:
  group: rmx2117-kernel
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      KERNEL_REF: ${{ inputs.kernel_ref || 'master' }}
      ROOT_MANAGER: ${{ startsWith(inputs.root_mode, 'resukisu') && 'resukisu' || startsWith(inputs.root_mode, 'xxksu') && 'xxksu' || 'none' }}
      HOOK_MODE: ${{ inputs.root_mode || 'resukisu-manual-lsm' }}
      HOOK_TYPE: ${{ endsWith(inputs.root_mode, '-auto') && 'auto' || endsWith(inputs.root_mode, '-susfs') && 'susfs' || endsWith(inputs.root_mode, '-syscall_table') && 'syscall_table' || endsWith(inputs.root_mode, '-branch_link') && 'branch_link' || startsWith(inputs.root_mode, 'resukisu') && 'manual' || 'none' }}
      HOOK_EXTRA: ${{ endsWith(inputs.root_mode, '-manual-source') && 'manual' || endsWith(inputs.root_mode, '-manual-lsm') && 'lsm' || '' }}
      AUTO_FIX_49: ${{ inputs.auto_fix_49 }}
      ENABLE_BBG: ${{ inputs.enable_bbg }}
      ENABLE_DROIDSPACE: ${{ inputs.enable_droidspace }}
      KERNEL_REPO: https://github.com/MOSSVENC/realme_X7_X7Pro_X7ProExtreme_X7-5G_Q2Pro_V15_V5_Q2_Narzo30pro-5G_7-5G-AndroidS-kernel-source.git
      DEFCONFIG: k6853v1_64_6360_defconfig
    steps:
      - name: Checkout action repo
        uses: actions/checkout@v7

      - name: Install binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            device-tree-compiler python3

      - name: Download AOSP clang 11 (r383902) + GCC 4.9 binutils
        run: |
          # Official toolchain per build.config.mtk.aarch64 in the kernel
          # tree: clang-r383902 (clang 11) + aarch64-linux-android-4.9
          # binutils with the androidkernel- prefix.
          for br in android12-release android11-release android12L-release; do
            if git ls-remote --heads \
                https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
                "$br" >/dev/null 2>&1; then
              echo "clang branch: $br"
              git clone -q --depth=1 --single-branch --branch "$br" \
                https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
                "$RUNNER_TEMP/tc/clang" && break
            fi
          done
          if [ ! -d "$RUNNER_TEMP/tc/clang/clang-r383902/bin" ]; then
            echo "clang-r383902 not found on android12/11 branches; fallback list:" >&2
            ls "$RUNNER_TEMP/tc/clang" 2>/dev/null | head -20 || true
            exit 1
          fi
          CLANG_BIN="$RUNNER_TEMP/tc/clang/clang-r383902/bin"
          ls "$CLANG_BIN/clang" >/dev/null
          git clone -q --depth=1 --single-branch --branch android12L-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            "$RUNNER_TEMP/tc/gcc64"
          ls "$RUNNER_TEMP/tc/gcc64/bin/aarch64-linux-androidkernel-gcc" >/dev/null || true
          echo "$RUNNER_TEMP/tc/gcc64/bin:$CLANG_BIN" >> "$GITHUB_PATH"

      - name: Clone kernel source (not part of this repo)
        run: |
          set -o pipefail
          git config --global http.postBuffer 524288000
          # Source tree lives in a kernel-4.14/ directory: oplus power
          # headers (oplus_battery_mtk6853R.h) include tcpm.h through a
          # ../../../../kernel-4.14/... relative path that assumes the
          # OPPO build layout.
          git clone --depth=1 --filter=blob:none \
            --branch="$KERNEL_REF" \
            "$KERNEL_REPO" \
            "$RUNNER_TEMP/kernel-4.14" 2>&1 | tee /tmp/clone.log
          echo "KROOT=$RUNNER_TEMP/kernel-4.14" >> "$GITHUB_ENV"
          head -6 "$RUNNER_TEMP/kernel-4.14/Makefile"
          { echo "### kernel clone"; tail -30 /tmp/clone.log; } >> "$GITHUB_STEP_SUMMARY" || true

      # --- ReSukiSU manual hooks (hook_mode=manual-lsm / manual-source) ---
      # 4.14 tree-adapted manual-hook patches (patches/resukisu/4.14,
      # 0010-0012 applied for manual-source) + ReSukiSU main + config
      # fragment via integrate-resukisu.sh.
      - name: Integrate ReSukiSU manual hooks (hook_mode=manual-lsm / manual-source)
        if: env.ROOT_MANAGER == 'resukisu' && env.HOOK_TYPE == 'manual'
        run: |
          cd "$KROOT"
          # File-level list: shared shapes (stat/reboot) live in
          # resukisu/4.9 as the single copy; MTK-local files in 4.14.
          PATCHES="$GITHUB_WORKSPACE/patches/resukisu/4.9/0001-fs-stat-ksu-manual-hook.patch"
          PATCHES="$PATCHES $GITHUB_WORKSPACE/patches/resukisu/4.14/0002-fs-exec-ksu-manual-hook.patch"
          PATCHES="$PATCHES $GITHUB_WORKSPACE/patches/resukisu/4.14/0003-fs-open-ksu-manual-hook.patch"
          PATCHES="$PATCHES $GITHUB_WORKSPACE/patches/resukisu/4.9/0004-kernel-reboot-ksu-manual-hook.patch"
          if [ "$HOOK_EXTRA" = "manual" ]; then
            echo "hook_extra=manual: also applying alt manual hooks (input/setuid/sys_read)"
            PATCHES="$PATCHES $GITHUB_WORKSPACE/patches/resukisu/4.14/0010-input-manual-hook.patch"
            PATCHES="$PATCHES $GITHUB_WORKSPACE/patches/resukisu/4.14/0011-setuid-manual-hook.patch"
            PATCHES="$PATCHES $GITHUB_WORKSPACE/patches/resukisu/4.14/0012-sysread-manual-hook.patch"
          else
            echo "hook_extra=lsm: alt hooks handled by LSM/input_handler AUTO machinery"
          fi
          # NOTE: absolute patch paths; apply-patches.sh cd's into KROOT
          bash "$GITHUB_WORKSPACE/scripts/apply-patches.sh" "$KROOT" $PATCHES
          bash "$GITHUB_WORKSPACE/scripts/integrate-resukisu.sh" "$KROOT" \
            "$GITHUB_WORKSPACE/resukisu.config.fragment" "$HOOK_EXTRA" manual

      # --- ReSukiSU auto hooks (hook_mode=auto) ---
      # ReSukiSU auto-hook branch via integrate-resukisu.sh (no source
      # patches; hook calls come from the runtime inline-hook engine).
      - name: Integrate ReSukiSU (auto-hook branch)
        if: env.ROOT_MANAGER == 'resukisu' && env.HOOK_TYPE == 'auto'
        run: |
          bash "$GITHUB_WORKSPACE/scripts/integrate-resukisu.sh" "$KROOT" \
            "$GITHUB_WORKSPACE/resukisu.config.fragment" lsm auto "$AUTO_FIX_49"

      # --- XXKSU (root_mode=xxksu-*): Backslashxx KernelSU fork ---
      # Fork hook types (syscall_table / branch_link) handle the sucompat
      # call sites itself: no manual source patches, no inline-hook
      # generator. Layout mirrors the ReSukiSU setup (KernelSU/kernel
      # symlinked as drivers/kernelsu). Tracks the fork master branch.
      - name: Integrate XXKSU kernel (Backslashxx fork)
        if: env.ROOT_MANAGER == 'xxksu'
        run: |
          git clone -q --depth=1 --single-branch \
            --branch=master \
            https://github.com/Backslashxx/KernelSU "$RUNNER_TEMP/xxksu"
          # 4.x kconfig has no '=' comparison; the LKM-only default line
          # would abort alldefconfig. In-tree KSU=y is set by the fragment.
          sed -i '/default y if KSU = m/d' "$RUNNER_TEMP/xxksu/kernel/Kconfig"
          cd "$KROOT"
          mkdir -p KernelSU
          ln -sfn "$RUNNER_TEMP/xxksu/kernel" KernelSU/kernel
          # absolute target: a relative link would resolve under drivers/
          ln -sfn "$RUNNER_TEMP/xxksu/kernel" drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || \
            sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_LSM_SECURITY_HOOKS=y"
            if [ "$HOOK_TYPE" = "branch_link" ]; then
              echo "CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y"
              echo "# CONFIG_KSU_TAMPER_SYSCALL_TABLE is not set"
            else
              echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE=y"
              echo "# CONFIG_KSU_HACK_ARM64_BRANCH_LINK is not set"
            fi
          } > "$GITHUB_WORKSPACE/xxksu.config.fragment"
          echo "xxksu hook type: $HOOK_TYPE"
          cat "$GITHUB_WORKSPACE/xxksu.config.fragment"

      # --- SuSFS 4.14 (root_mode=resukisu-susfs) ---
      # Tree-adapted port patches/susfs/4.14/susfs-port.patch (git
      # apply-verified on MTK 4.14.186 snapshots) + ReSukiSU main +
      # the 4.x inline-hook generator (scripts/susfs_inline_hook_patches-nongki.sh).
      - name: Apply SuSFS 4.14 port (root_mode=resukisu-susfs)
        if: env.ROOT_MANAGER == 'resukisu' && env.HOOK_TYPE == 'susfs'
        run: |
          cd "$KROOT"
          # ReSukiSU setup (main branch; wires drivers/kernelsu + Kconfig)
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
          # SuSFS 4.14 kernel-side port (patches/susfs/4.14/)
          P="$GITHUB_WORKSPACE/patches/susfs/4.14/susfs-port.patch"
          git apply --check "$P" || { echo "test patch does not apply cleanly"; exit 1; }
          git apply "$P"
          echo "SuSFS 4.14 port applied:"
          grep -c 'CONFIG_KSU_SUSFS' fs/susfs.c include/linux/susfs.h
          # inline hook call sites (setresuid/execveat/faccessat/sys_read/stat)
          cp "$GITHUB_WORKSPACE/scripts/susfs_inline_hook_patches-nongki.sh" ./
          bash ./susfs_inline_hook_patches-nongki.sh 2>&1 | tail -30
          MISSING=""
          for spec in "ksu_handle_setresuid:kernel/sys.c" "ksu_handle_execveat:fs/exec.c" \
                      "ksu_handle_faccessat:fs/open.c" "ksu_handle_sys_read:fs/read_write.c" \
                      "ksu_handle_stat:fs/stat.c"; do
            sym="${spec%%:*}"; file="${spec##*:}"
            grep -q "$sym" "$file" || MISSING="$MISSING $sym($file)"
          done
          if [ -n "$MISSING" ]; then
            echo "hook generator left missing:$MISSING" >&2
            exit 1
          fi
          echo "SuSFS KSU-interaction hooks present"

      - name: Integrate Baseband-guard (BBG)
        if: env.ENABLE_BBG == 'true'
        run: |
          # Upstream setup.sh wires security/baseband-guard and, on this
          # pre-5.1 tree (no DEFINE_LSM), patches security/selinux
          # (Makefile sepatch + objsec.h bbg_cred). Fragment carries
          # CONFIG_BBG=y; merge-defconfig.sh asserts it.
          bash "$GITHUB_WORKSPACE/scripts/integrate-bbg.sh" "$KROOT" \
            "$GITHUB_WORKSPACE/bbg.config.fragment"

      - name: Integrate Droidspace (patch + config)
        if: env.ENABLE_DROIDSPACE == 'true'
        run: |
          cd "$KROOT"
          P02="$GITHUB_WORKSPACE/patches/droidspace/upstream/0002-official-fix-restore-cgroup-file-prefix-handling.patch"
          git apply --check "$P02" && git apply "$P02" || \
            { echo "!! droidspace cgroup patch did not apply; continuing (non-fatal)"; }
          echo "Droidspace 4.14 patches done (config merged below)"

      - name: Commit patched kernel tree (drop -dirty from version)
        run: |
          cd "$KROOT"
          git config user.email "action@localhost"
          git config user.name "kernel-builder"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit (clean tree)"
          else
            git commit -q -m "apply MVNonGKIDevices RMX2117 feature patches"
            echo "committed patched tree: $(git rev-parse --short HEAD)"
          fi

      - name: Set warning policy for the tree (warnings-only build)
        run: |
          cd "$KROOT"
          # Build with warnings reported, with -Werror promotions turned
          # off across the tree (subdir ccflags and the top-level
          # -Werror=<warning> set). cc-option keeps the -Werror=<warning>
          # flags because the compiler supports them.
          grep -rl -- "-Werror" --include=Makefile --include=Kbuild . 2>/dev/null | while read -r mf; do
            sed -i 's/ccflags-y += -Werror/ccflags-y += -Wno-error/g; s/subdir-ccflags-y += -Werror/subdir-ccflags-y += -Wno-error/g; s/KBUILD_CFLAGS += -Werror/KBUILD_CFLAGS += -Wno-error/g' "$mf"
            echo "updated: $mf"
          done
          sed -i 's/-Werror=implicit-int/-Wno-error=implicit-int/g; s/-Werror=strict-prototypes/-Wno-error=strict-prototypes/g; s/-Werror=date-time/-Wno-error=date-time/g; s/-Werror=incompatible-pointer-types/-Wno-error=incompatible-pointer-types/g; s/-Werror=designated-init/-Wno-error=designated-init/g' Makefile
          echo "top-level -Werror= flags updated"
      - name: Assemble defconfig (baseline + feature fragments)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/logs"
          cd "$KROOT"
          export ARCH=arm64
          export PATH="$RUNNER_TEMP/tc/gcc64/bin:$RUNNER_TEMP/tc/clang/clang-r383902/bin:$PATH"
          FRAGS=""
          if [ "$ROOT_MANAGER" = "resukisu" ]; then
            if [ "$HOOK_TYPE" = "susfs" ]; then
              cat > "$GITHUB_WORKSPACE/susfs.config.fragment" <<'FRAGEOF'
          CONFIG_KSU=y
          # CONFIG_KSU_DEBUG is not set
          # CONFIG_KSU_TRACEPOINT_HOOK is not set
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          FRAGEOF
              FRAGS="$GITHUB_WORKSPACE/susfs.config.fragment"
            else
              FRAGS="$GITHUB_WORKSPACE/resukisu.config.fragment"
            fi
          elif [ "$ROOT_MANAGER" = "xxksu" ]; then
            FRAGS="$GITHUB_WORKSPACE/xxksu.config.fragment"
          fi
          if [ "$ENABLE_BBG" = "true" ]; then
            FRAGS="$FRAGS $GITHUB_WORKSPACE/bbg.config.fragment"
          fi
          if [ "$ENABLE_DROIDSPACE" = "true" ]; then
            FRAGS="$FRAGS $GITHUB_WORKSPACE/patches/droidspace/4.14/droidspace.config"
          fi
          # Shared defconfig assembler: alldefconfig from baseline +
          # fragments, then asserts the enabled feature symbol chains.
          # MTK project defconfig k6853v1_64_6360 is the baseline.
          # sdcardfs data-isolation is a mix2s-scoped feature and stays
          # off for this build.
          BASE_DEFCONFIG="arch/arm64/configs/k6853v1_64_6360_defconfig" \
          DEVICE_FRAGMENTS="" \
          ROOT_MANAGER="$ROOT_MANAGER" \
          ENABLE_BBG="$ENABLE_BBG" \
          ENABLE_DROIDSPACE="$ENABLE_DROIDSPACE" \
          ENABLE_DATA_ISOLATION=false \
          HOOK_TYPE="$HOOK_TYPE" \
          HOOK_EXTRA="$HOOK_EXTRA" \
          bash "$GITHUB_WORKSPACE/scripts/merge-defconfig.sh" "$KROOT" "$RUNNER_TEMP/out" $FRAGS
          cp -f "$RUNNER_TEMP/out/.config" "$GITHUB_WORKSPACE/logs/final.config"

      - name: Build kernel Image + dtbs
        run: |
          set -o pipefail
          cd "$KROOT"
          export PATH="$RUNNER_TEMP/tc/gcc64/bin:$RUNNER_TEMP/tc/clang/clang-r383902/bin:$PATH"
          make -j"$(nproc)" O="$RUNNER_TEMP/out" ARCH=arm64 \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-androidkernel- \
            LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
            Image \
            2>&1 | tee "$GITHUB_WORKSPACE/logs/build.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" = 0 ]; then
            make O="$RUNNER_TEMP/out" ARCH=arm64 \
              CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-androidkernel- \
              LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
              dtbs >> "$GITHUB_WORKSPACE/logs/build.log" 2>&1
            rc=${PIPESTATUS[0]}
          fi
          cp -f "$RUNNER_TEMP/out/arch/arm64/boot/Image" "$RUNNER_TEMP/out/Image" 2>/dev/null || true
          cp -f "$RUNNER_TEMP/out/arch/arm64/boot/dts/mediatek/mt6853.dtb" "$RUNNER_TEMP/out/mt6853.dtb" 2>/dev/null || true
          [ -f "$RUNNER_TEMP/out/Image" ] || { echo "Image not produced"; rc=1; }
          if [ "$rc" != 0 ]; then
            { echo "### build kernel FAILED (rc=$rc)"; tail -120 "$GITHUB_WORKSPACE/logs/build.log"; } >> "$GITHUB_STEP_SUMMARY" || true
            exit "$rc"
          fi
          { echo "### build kernel OK"; tail -20 "$GITHUB_WORKSPACE/logs/build.log"; } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Package AnyKernel3 zip (Image.gz-dtb; dtbo partition untouched)
        run: |
          gzip -c "$RUNNER_TEMP/out/Image" > "$RUNNER_TEMP/out/Image.gz"
          # appended base dtb: byte-identical to the dtb carried by the
          # community Q2 build, self-contained boot kernel segment
          cat "$RUNNER_TEMP/out/Image.gz" "$RUNNER_TEMP/out/mt6853.dtb" > "$RUNNER_TEMP/out/Image.gz-dtb"
          rm -rf "$RUNNER_TEMP/ak3"
          # full AnyKernel3 template (anykernel.sh + tools/ak3-core.sh,
          # magiskboot, META-INF ...) — not a hand-rolled minimal layout
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git \
            "$RUNNER_TEMP/ak3"
          # strip VCS/CI cruft so the zip holds only flash-relevant files
          rm -rf "$RUNNER_TEMP/ak3/.git" "$RUNNER_TEMP/ak3/.github" \
                 "$RUNNER_TEMP/ak3/.gitignore" "$RUNNER_TEMP/ak3/.gitattributes"
          # --- RMX2117 (realme Q2) settings ---
          # zip ships Image.gz-dtb (kernel + appended base dtb, the same
          # form as the community Q2 build): AK3 swaps the kernel segment
          # of the on-device boot image and keeps its ramdisk; the dtbo
          # partition is never touched. Device-name check is skipped
          # (fastboot product name not pinned on MTK).
          # feature display composed by the shared script (root / hook
          # type / feature level; manual-hook detail lines follow)
          python3 "$GITHUB_WORKSPACE/scripts/ak3-display.py" \
            "$RUNNER_TEMP/ak3/anykernel.sh" "RMX2117"

          sed -i "s/^do.devicecheck=.*/do.devicecheck=0;/"                     "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s/^\(\s*\)device.name1=.*/\1device.name1=/"             "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s/^\(\s*\)device.name2=.*/\1device.name2=/"             "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s|^BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|"     "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0;/"                    "$RUNNER_TEMP/ak3/anykernel.sh"
          cp "$RUNNER_TEMP/out/Image.gz-dtb" "$RUNNER_TEMP/ak3/"
          ( cd "$RUNNER_TEMP/ak3" && zip -r9 "$RUNNER_TEMP/RMX2117-kernel.zip" . >/dev/null )

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build.log
          path: ${{ github.workspace }}/logs/build.log
          archive: false
          if-no-files-found: warn
          retention-days: 14

      - name: Upload kernel image
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Image
          path: ${{ runner.temp }}/out/Image
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload device tree
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: mt6853.dtb
          path: ${{ runner.temp }}/out/mt6853.dtb
          archive: false
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final config
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: final.config
          path: ${{ github.workspace }}/logs/final.config
          archive: false
          if-no-files-found: warn
          retention-days: 14

      - name: Post-build summary
        if: always()
        run: |
          { echo "## RMX2117 build (${{ env.DEFCONFIG }}, ${{ env.HOOK_MODE }})"
            echo "- kernel_ref: ${{ env.KERNEL_REF }}"
            echo "- features: mode=$HOOK_MODE manager=$ROOT_MANAGER bbg=$ENABLE_BBG droidspace=$ENABLE_DROIDSPACE"
            echo "- artifacts: Image / mt6853.dtb / final.config / build.log"
            echo "- dtbo partition image: carried over from stock firmware"
          } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload AnyKernel3 package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: RMX2117-kernel.zip
          path: ${{ runner.temp }}/RMX2117-kernel.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

