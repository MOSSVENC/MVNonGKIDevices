name: build-beryllium

# Builds a Xiaomi Pocophone F1 (beryllium, sdm845) kernel from Flyme66's
# clean "thirteen" tree with selectable features (ReSukiSU manual hook /
# BBG / Droidspace) and packages it as an AnyKernel3 zip.
#
# Mirrors build-polaris.yml; differences:
#   - kernel source: Flyme66/kernel_xiaomi_sdm845_tejas101k_beryllium @ thirteen
#   - baseline defconfig: beryllium_defconfig (self-contained, no fragments)
#   - CLEAR_LOCALVERSION=true (stock defconfig ships "-Helios™")
# Feature defaults mirror the workflow_dispatch input defaults below.

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: kernel branch/ref to build
        required: false
        default: thirteen
      root_mode:
        description: "root manager & hook mode: see README section \"root_mode\""
        type: choice
        options:
          - resukisu-manual-lsm
          - resukisu-manual-source
          - resukisu-auto
          - resukisu-susfs
          - xxksu-syscall_table
          - xxksu-branch_link
          - none
        default: resukisu-manual-lsm
      enable_bbg:
        description: integrate Baseband-guard (BBG)
        type: boolean
        default: false
      enable_droidspace:
        description: enable Droidspaces/LXC kernel support
        type: boolean
        default: false
      cgroup_port:
        description: 4.9 cgroup noprefix compat patch (droidspace)
        type: boolean
        default: false
      auto_fix_49:
        description: "4.x auto-hook kasan_reset_tag guard fix (resukisu-auto)"
        type: boolean
        default: false

concurrency:
  group: beryllium-kernel
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      # workflow_dispatch inputs are empty on push-triggered runs, so every
      # option falls back to a default (thirteen + all features on).
      KERNEL_REF: ${{ inputs.kernel_ref || 'thirteen' }}
      KERNEL_REPO: https://github.com/Flyme66/kernel_xiaomi_sdm845_tejas101k_beryllium.git
      ROOT_MANAGER: ${{ startsWith(inputs.root_mode, 'resukisu') && 'resukisu' || startsWith(inputs.root_mode, 'xxksu') && 'xxksu' || 'none' }}
      ENABLE_BBG: ${{ inputs.enable_bbg }}
      ENABLE_DROIDSPACE: ${{ inputs.enable_droidspace }}
      CGROUP_PORT: ${{ inputs.cgroup_port }}
      ENABLE_DATA_ISOLATION: "false"   # sdcardfs data isolation is polaris-specific
      HOOK_TYPE: ${{ endsWith(inputs.root_mode, '-auto') && 'auto' || endsWith(inputs.root_mode, '-susfs') && 'susfs' || endsWith(inputs.root_mode, '-syscall_table') && 'syscall_table' || endsWith(inputs.root_mode, '-branch_link') && 'branch_link' || startsWith(inputs.root_mode, 'resukisu') && 'manual' || 'none' }}
      HOOK_EXTRA: ${{ endsWith(inputs.root_mode, '-manual-source') && 'manual' || endsWith(inputs.root_mode, '-manual-lsm') && 'lsm' || '' }}
      AUTO_FIX_49: ${{ inputs.auto_fix_49 }}
    steps:
      - name: Checkout action repo
        uses: actions/checkout@v7

      # NOTE: no "Free disk space" step — it intermittently stalls on some
      # runners for many minutes; our build fits in the runner's disk.

      # Toolchain: AOSP clang 14 (clang-r450784d from android13-release)
      # + system binutils, matching the maintainer's official flow.
      - name: Install binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip curl bc bison flex libssl-dev make \
            libncurses-dev python3 python3-pip \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Download AOSP clang 14 + GCC 4.9 binutils
        run: |
          mkdir -p "$RUNNER_TEMP/tc"
          # AOSP clang (contains clang + ld.lld)
          git clone -q --depth=1 --single-branch \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            -b android13-release "$RUNNER_TEMP/tc/clang"
          CLANG_BIN="$RUNNER_TEMP/tc/clang/clang-r450784d/bin"
          ls "$CLANG_BIN/clang" >/dev/null
          echo "CLANG_DIR=$CLANG_BIN" >> "$GITHUB_ENV"
          # Android GCC 4.9 cross toolchains: clang (without LLVM=1) locates
          # the external as/ld for the vDSO (AArch32) builds via these bin
          # dirs on PATH (gcc-toolchain style layout with <triple>-as/ld).
          git clone -q --depth=1 --single-branch \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            -b android12L-release "$RUNNER_TEMP/tc/gcc64"
          git clone -q --depth=1 --single-branch \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            -b android12L-release "$RUNNER_TEMP/tc/gcc32"
          echo "$RUNNER_TEMP/tc/gcc64/bin:$RUNNER_TEMP/tc/gcc32/bin:$CLANG_BIN" >> "$GITHUB_PATH"

      - name: Clone kernel source (not part of this repo)
        run: |
          set -o pipefail
          git config --global http.postBuffer 524288000
          # partial clone: fetch commit+tree first, blobs fetched lazily in
          # batches — avoids GitHub's single-pack transfer limit on 1.5GB repos
          git clone --depth=1 --filter=blob:none \
            --branch="$KERNEL_REF" \
            "$KERNEL_REPO" \
            "$RUNNER_TEMP/kernel" 2>&1 | tee /tmp/clone.log
          echo "KROOT=$RUNNER_TEMP/kernel" >> "$GITHUB_ENV"
          head -6 "$RUNNER_TEMP/kernel/Makefile"
          # surface errors via step summary (readable through the API)
          { echo "### kernel clone"; tail -40 /tmp/clone.log; } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Apply ReSukiSU manual-hook patches
        if: env.ROOT_MANAGER == 'resukisu' && env.HOOK_TYPE != 'auto' && env.HOOK_TYPE != 'susfs'
        run: |
          # NOTE: pass ABSOLUTE patch-dir paths — apply-patches.sh cd's into
          # the kernel root, so relative paths would not resolve.
          PATCH_DIRS="$GITHUB_WORKSPACE/patches/resukisu/4.9"
          if [ "$HOOK_EXTRA" = "manual" ]; then
            echo "hook_extra=manual: also applying alt manual hooks (input/setuid/sys_read)"
            PATCH_DIRS="$PATCH_DIRS $GITHUB_WORKSPACE/patches/resukisu/4.9"
          else
            echo "hook_extra=lsm: alt hooks handled by LSM/input_handler AUTO machinery"
          fi
          bash scripts/apply-patches.sh "$KROOT" $PATCH_DIRS

      - name: Integrate ReSukiSU (kernel/setup.sh + config fragment)
        if: env.ROOT_MANAGER == 'resukisu'
        run: |
          bash scripts/integrate-resukisu.sh "$KROOT" \
            "$GITHUB_WORKSPACE/resukisu.config.fragment" "$HOOK_EXTRA" "$HOOK_TYPE" "$AUTO_FIX_49"

      # --- XXKSU (root_mode=xxksu-*): Backslashxx KernelSU fork ---
      # Fork hook types (syscall_table / branch_link) handle the sucompat
      # call sites itself: no manual source patches, no inline-hook
      # generator. Layout mirrors the ReSukiSU setup (KernelSU/kernel
      # symlinked as drivers/kernelsu). Tracks the fork master branch.
      - name: Integrate XXKSU kernel (Backslashxx fork)
        if: env.ROOT_MANAGER == 'xxksu'
        run: |
          git clone -q --depth=1 --single-branch \
            --branch=master \
            https://github.com/Backslashxx/KernelSU "$RUNNER_TEMP/xxksu"
          # 4.x kconfig has no '=' comparison; the LKM-only default line
          # would abort alldefconfig. In-tree KSU=y is set by the fragment.
          sed -i '/default y if KSU = m/d' "$RUNNER_TEMP/xxksu/kernel/Kconfig"
          cd "$KROOT"
          mkdir -p KernelSU
          ln -sfn "$RUNNER_TEMP/xxksu/kernel" KernelSU/kernel
          # absolute target: a relative link would resolve under drivers/
          ln -sfn "$RUNNER_TEMP/xxksu/kernel" drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || \
            sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig
          # Hook engines are mutually exclusive at the Kconfig level
          # (KSU_HACK_ARM64_BRANCH_LINK depends on !KSU_TAMPER_SYSCALL_TABLE).
          case "$HOOK_TYPE" in
            branch_link) ENGINE=branch_link ;;
            syscall_table) ENGINE=syscall_table ;;
            *) ENGINE=none ;;
          esac
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_LSM_SECURITY_HOOKS=y"
            case "$ENGINE" in
              branch_link)
                echo "CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y"
                echo "# CONFIG_KSU_TAMPER_SYSCALL_TABLE is not set"
                ;;
              syscall_table)
                echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE=y"
                echo "# CONFIG_KSU_HACK_ARM64_BRANCH_LINK is not set"
                ;;
              *)
                echo "# CONFIG_KSU_TAMPER_SYSCALL_TABLE is not set"
                echo "# CONFIG_KSU_HACK_ARM64_BRANCH_LINK is not set"
                ;;
            esac
          } > "$GITHUB_WORKSPACE/xxksu.config.fragment"
          echo "xxksu mode: $HOOK_TYPE engine: $ENGINE"
          cat "$GITHUB_WORKSPACE/xxksu.config.fragment"

      # SuSFS kernel-side port from the test-tree beryllium reference,
      # applied AFTER ReSukiSU setup.sh (hook_mode=susfs).
      - name: Apply SuSFS 4.9 port (root_mode=resukisu-susfs)
        if: env.ROOT_MANAGER == 'resukisu' && env.HOOK_TYPE == 'susfs'
        run: |
          cd "$KROOT"
          P="$GITHUB_WORKSPACE/patches/susfs/4.9/beryllium/susfs-port.patch"
          git apply --check "$P" || { echo "test patch does not apply cleanly"; exit 1; }
          git apply "$P"
          echo "SuSFS port applied:"
          grep -c 'CONFIG_KSU_SUSFS' fs/susfs.c include/linux/susfs.h

          # post-execve su-compat call (su fd install path with current
          # ReSukiSU su_fd): idempotent injections on fs/exec.c
          python3 "$GITHUB_WORKSPACE/scripts/susfs-exec-post-sucompat.py" \
            "$KROOT/fs/exec.c"
          echo "SuSFS port + post-sucompat applied:"
          grep -c 'ksu_handle_post_execveat_sucompat' fs/exec.c

      - name: Integrate Baseband-guard (BBG)
        if: env.ENABLE_BBG == 'true'
        run: |
          bash scripts/integrate-bbg.sh "$KROOT" \
            "$GITHUB_WORKSPACE/bbg.config.fragment"

      - name: Integrate Droidspace (patch + config)
        if: env.ENABLE_DROIDSPACE == 'true'
        run: |
          PORT=""
          if [ "$CGROUP_PORT" = "true" ]; then
            PORT="$GITHUB_WORKSPACE/patches/droidspace/4.9/0001-cgroup-noprefix-4.9-port.patch"
          fi
          bash scripts/integrate-droidspace.sh "$KROOT" "$PORT"

      # Commit all applied patches so `make`'s setlocalversion sees a clean
      # git tree -> kernel version loses the "-dirty" suffix while keeping
      # the git describe commit id (4.9 uses CONFIG_LOCALVERSION_AUTO).
      - name: Commit patched kernel tree (drop -dirty from version)
        run: |
          cd "$KROOT"
          git config user.email "action@localhost"
          git config user.name "kernel-builder"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit (clean tree)"
          else
            git commit -q -m "apply MVNonGKIDevices feature patches (resukisu/bbg/droidspace)"
            echo "committed patched tree: $(git rev-parse --short HEAD)"
          fi

      - name: Assemble defconfig (baseline + feature fragments)
        run: |
          FRAGS=""
          if [ "$ROOT_MANAGER" = "resukisu" ]; then
            FRAGS="$FRAGS $GITHUB_WORKSPACE/resukisu.config.fragment"
          elif [ "$ROOT_MANAGER" = "xxksu" ]; then
            FRAGS="$FRAGS $GITHUB_WORKSPACE/xxksu.config.fragment"
          fi
          [ "$ENABLE_BBG" = "true" ] && FRAGS="$FRAGS $GITHUB_WORKSPACE/bbg.config.fragment"
          [ "$ENABLE_DROIDSPACE" = "true" ] && FRAGS="$FRAGS $GITHUB_WORKSPACE/patches/droidspace/4.9/droidspace.config"
          BASE_DEFCONFIG="arch/arm64/configs/beryllium_defconfig" \
          DEVICE_FRAGMENTS="" \
          CLEAR_LOCALVERSION="true" \
          ROOT_MANAGER="$ROOT_MANAGER" \
          ENABLE_BBG="$ENABLE_BBG" \
          ENABLE_DROIDSPACE="$ENABLE_DROIDSPACE" \
          ENABLE_DATA_ISOLATION="$ENABLE_DATA_ISOLATION" \
          HOOK_EXTRA="$HOOK_EXTRA" \
          HOOK_TYPE="$HOOK_TYPE" \
          bash scripts/merge-defconfig.sh "$KROOT" "$RUNNER_TEMP/out" $FRAGS

      - name: Build kernel Image.gz-dtb
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/logs"
          # Unified toolchain: AOSP clang 14 + LD=ld.lld.
          export PATH="$CLANG_DIR:$PATH"
          export KBUILD_BUILD_HOST=build
          export KBUILD_BUILD_USER=kernel
          cd "$KROOT"
          # Absolute toolchain prefixes (JackA1ltman style): the 4.9 arm64
          # Makefile requires CROSS_COMPILE_ARM32 for the compat vDSO and
          # resolves $(CROSS_COMPILE_ARM32)ld via which/absolute path; the
          # AOSP GCC 4.9 prebuilts provide the <triple>-as/ld for clang's
          # external assembler/linker when it builds the AArch32 vDSO.
          make -j"$(nproc)" O="$RUNNER_TEMP/out" ARCH=arm64 \
            CC="clang" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            CROSS_COMPILE="$RUNNER_TEMP/tc/gcc64/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="$RUNNER_TEMP/tc/gcc32/bin/arm-linux-androideabi-" \
            LD=ld.lld LLVM=1 LLVM_IAS=1 \
            2>&1 | tee "$GITHUB_WORKSPACE/logs/build.log"
          rc=${PIPESTATUS[0]}
          cp -f "$RUNNER_TEMP/out/.config" "$GITHUB_WORKSPACE/logs/final.config" 2>/dev/null || true
          cp -f "$RUNNER_TEMP/out/arch/arm64/boot/Image.gz-dtb" "$RUNNER_TEMP/out/Image.gz-dtb" 2>/dev/null || true
          [ -f "$RUNNER_TEMP/out/arch/arm64/boot/Image.gz-dtb" ] || { echo "Image.gz-dtb not produced"; rc=1; }
          if [ "$rc" != 0 ]; then
            { echo "### build kernel FAILED (rc=$rc)"; tail -100 "$GITHUB_WORKSPACE/logs/build.log"; } >> "$GITHUB_STEP_SUMMARY" || true
            exit "$rc"
          fi
          { echo "### build kernel OK"; tail -20 "$GITHUB_WORKSPACE/logs/build.log"; } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Package AnyKernel3 zip
        run: |
          rm -rf "$RUNNER_TEMP/ak3"
          # full AnyKernel3 template (anykernel.sh + tools/ak3-core.sh,
          # magiskboot, META-INF ...) — not a hand-rolled minimal layout
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git \
            "$RUNNER_TEMP/ak3"
          # strip VCS/CI cruft so the zip holds only flash-relevant files
          rm -rf "$RUNNER_TEMP/ak3/.git" "$RUNNER_TEMP/ak3/.github" \
                 "$RUNNER_TEMP/ak3/.gitignore" "$RUNNER_TEMP/ak3/.gitattributes"
          # --- beryllium (Pocophone F1) settings ---
          # device props inside properties() are indented; boot vars at top
          # per-build display: banner + kernel.string for the flash-time
          # screen, FEATURES.txt inside the zip for inspection
          python3 "$GITHUB_WORKSPACE/scripts/ak3-display.py" \
            "$RUNNER_TEMP/ak3" "beryllium" \
            "$RUNNER_TEMP/zipname.txt"
          # package name follows this build's inputs
          # (codename_manager_hook_feature...)
          AK3_ZIP="$(cat "$RUNNER_TEMP/zipname.txt")"
          echo "AK3_ZIP=$AK3_ZIP" >> "$GITHUB_ENV"
          echo "=== PocoF1 kernel features (this build) ==="
          cat "$RUNNER_TEMP/ak3/FEATURES.txt"

          sed -i "s/^\(\s*\)device.name1=.*/\1device.name1=beryllium/"       "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s/^\(\s*\)device.name2=.*/\1device.name2=/"                "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s/^\(\s*\)device.name3=.*/\1device.name3=/"                "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s/^\(\s*\)device.name4=.*/\1device.name4=/"                "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s|^BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|"   "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0;/"                  "$RUNNER_TEMP/ak3/anykernel.sh"
          cp "$RUNNER_TEMP/out/Image.gz-dtb" "$RUNNER_TEMP/ak3/"
          # zip INSIDE ak3/ so the zip root is anykernel.sh/META-INF/tools/
          # (standard AnyKernel3 layout, no extra wrapper directory)
          ( cd "$RUNNER_TEMP/ak3" && zip -r9 "$RUNNER_TEMP/$AK3_ZIP" . >/dev/null )

      # --- three SEPARATE artifacts, never nested/repacked into each other ---
      # 1) raw build log  2) raw kernel image  3) standard AnyKernel3 zip
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build.log
          path: ${{ github.workspace }}/logs/build.log
          archive: false
          if-no-files-found: warn
          retention-days: 14

      - name: Upload kernel image
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Image.gz-dtb
          path: ${{ runner.temp }}/out/Image.gz-dtb
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload AnyKernel3 package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.AK3_ZIP }}
          path: ${{ runner.temp }}/${{ env.AK3_ZIP }}
          archive: false
          if-no-files-found: error
          retention-days: 14
