name: build-alioth

# Builds a Xiaomi Redmi K40 / POCO F3 (alioth, sm8250/kona) kernel from
# MOSSVENC's fork of the LineageOS 4.19 kernel with selectable features
# (ReSukiSU hook modes / BBG / Droidspace 4.19 / SuSFS 4.19 via the
# test-tree reference) and packages it as an AnyKernel3 zip.
#
# Kernel: 4.19.325 (arch/arm64, CAF kona), boot image header v3 on a
# virtual-A/B device; kernel Image goes to the boot partition and the
# device-tree overlays live in a separate dtbo.img (see packaging step).
#
# Feature defaults mirror the workflow_dispatch input defaults below.

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: kernel branch/ref to build
        required: false
        default: lineage-23.2
      enable_resukisu:
        description: integrate ReSukiSU (hook mode selected below)
        type: boolean
        default: true
      enable_bbg:
        description: integrate Baseband-guard (BBG)
        type: boolean
        default: true
      enable_droidspace:
        description: enable Droidspaces/LXC kernel support (4.19)
        type: boolean
        default: true
      hook_mode:
        description: "resukisu hook mode: manual-lsm (source patches + LSM AUTO, default) | manual-source (source patches + alt manual hooks) | auto (auto-hook branch, no source patches) | susfs-test (SuSFS 4.19 from test-tree output)"
        type: choice
        options:
          - manual-lsm
          - manual-source
          - auto
          - susfs-test
        default: manual-lsm
      auto_fix_49:
        description: "fix auto-hook branch <5.0 kasan_reset_tag guard on 4.x (only effective when hook_mode=auto)"
        type: boolean
        default: true

concurrency:
  group: alioth-kernel
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      # workflow_dispatch inputs are empty on push-triggered runs, so every
      # option falls back to a default (lineage-23.2 + all features on).
      KERNEL_REF: ${{ inputs.kernel_ref || 'lineage-23.2' }}
      KERNEL_REPO: https://github.com/MOSSVENC/android_kernel_xiaomi_sm8250.git
      ENABLE_RESUKISU: ${{ inputs.enable_resukisu }}
      ENABLE_BBG: ${{ inputs.enable_bbg }}
      ENABLE_DROIDSPACE: ${{ inputs.enable_droidspace }}
      ENABLE_DATA_ISOLATION: "false"   # sdcardfs data isolation is a 4.9 sdm845 feature
      HOOK_TYPE: ${{ inputs.hook_mode == 'susfs-test' && 'susfs' || startsWith(inputs.hook_mode, 'auto') && 'auto' || 'manual' }}
      SUSFS_SOURCE: test
      HOOK_EXTRA: ${{ inputs.hook_mode == 'manual-source' && 'manual' || 'lsm' }}
      AUTO_FIX_49: ${{ inputs.auto_fix_49 }}
    steps:
      - name: Checkout action repo
        uses: actions/checkout@v7

      # Unified toolchain across all supported devices: AOSP clang 14
      # (clang-r450784d from android13-release) + Android GCC 4.9 prebuilt
      # binutils. The 4.19 tree is built with LLVM=1, 复用本仓库 4.9 设备
      # 的工具链配方（与官方 android-4.19 build.config 的 LLVM=1 一致）。
      - name: Install binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip curl bc bison flex libssl-dev make \
            libncurses-dev python3 python3-pip \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Download AOSP clang 14 + GCC 4.9 binutils
        run: |
          mkdir -p "$RUNNER_TEMP/tc"
          git clone -q --depth=1 --single-branch \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            -b android13-release "$RUNNER_TEMP/tc/clang"
          CLANG_BIN="$RUNNER_TEMP/tc/clang/clang-r450784d/bin"
          ls "$CLANG_BIN/clang" >/dev/null
          echo "CLANG_DIR=$CLANG_BIN" >> "$GITHUB_ENV"
          git clone -q --depth=1 --single-branch \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            -b android12L-release "$RUNNER_TEMP/tc/gcc64"
          git clone -q --depth=1 --single-branch \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            -b android12L-release "$RUNNER_TEMP/tc/gcc32"
          echo "$RUNNER_TEMP/tc/gcc64/bin:$RUNNER_TEMP/tc/gcc32/bin:$CLANG_BIN" >> "$GITHUB_PATH"

      - name: Clone kernel source (not part of this repo)
        run: |
          set -o pipefail
          git config --global http.postBuffer 524288000
          git clone --depth=1 --filter=blob:none \
            --branch="$KERNEL_REF" \
            "$KERNEL_REPO" \
            "$RUNNER_TEMP/kernel" 2>&1 | tee /tmp/clone.log
          echo "KROOT=$RUNNER_TEMP/kernel" >> "$GITHUB_ENV"
          head -6 "$RUNNER_TEMP/kernel/Makefile"
          { echo "### kernel clone"; tail -40 /tmp/clone.log; } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Apply ReSukiSU manual-hook source patches (4.19 variants)
        if: env.ENABLE_RESUKISU == 'true' && env.HOOK_TYPE != 'auto' && env.HOOK_TYPE != 'susfs'
        run: |
          # 4.19 tree: patches/resukisu-manual-hook/419/ carries the
          # 4.19-shaped mandatory hooks (stat/faccessat host-context and
          # call-shape differ from the 4.9 common/ set; exec/reboot are
          # the same). Apply 419 only — never common/ on this tree.
          PATCH_DIRS="$GITHUB_WORKSPACE/patches/resukisu-manual-hook/419"
          if [ "$HOOK_EXTRA" = "manual" ]; then
            echo "hook_extra=manual: also applying 4.19 alt manual hooks (input/setuid/sys_read)"
            PATCH_DIRS="$PATCH_DIRS $GITHUB_WORKSPACE/patches/resukisu-manual-hook/419-alt"
          else
            echo "hook_extra=lsm: alt hooks handled by LSM/input_handler AUTO machinery"
          fi
          bash scripts/apply-patches.sh "$KROOT" $PATCH_DIRS

      - name: Integrate ReSukiSU (kernel/setup.sh + config fragment)
        if: env.ENABLE_RESUKISU == 'true'
        run: |
          bash scripts/integrate-resukisu.sh "$KROOT" \
            "$GITHUB_WORKSPACE/resukisu.config.fragment" "$HOOK_EXTRA" "$HOOK_TYPE" "$AUTO_FIX_49"

      # SuSFS 4.19 kernel-side port from the test-tree 5.10->4.19 pipeline,
      # applied AFTER ReSukiSU setup.sh (hook_mode=susfs-test).
      - name: Apply SuSFS 4.19 test-tree port (hook_mode=susfs-test)
        if: env.ENABLE_RESUKISU == 'true' && env.HOOK_TYPE == 'susfs'
        run: |
          cd "$KROOT"
          P="$GITHUB_WORKSPACE/test/susfs-510-to-419/susfs-419-test.patch"
          git apply --check "$P" || { echo "test patch does not apply cleanly"; exit 1; }
          git apply "$P"
          echo "SuSFS 4.19 port applied:"
          grep -c 'CONFIG_KSU_SUSFS' fs/susfs.c include/linux/susfs.h

      - name: Integrate Baseband-guard (BBG)
        if: env.ENABLE_BBG == 'true'
        run: |
          bash scripts/integrate-bbg.sh "$KROOT" \
            "$GITHUB_WORKSPACE/bbg.config.fragment"

      - name: Integrate Droidspace (4.19 official patches + config)
        if: env.ENABLE_DROIDSPACE == 'true'
        run: |
          # Official non-GKI patch 2/2 (cgroup prefix symlink) applies
          # as-is on the 4.19 kona tree; patch 1/2 (xt_qtaguid) is a
          # no-op here because LOS sm8250 has no qtaguid — skip it.
          cd "$KROOT"
          P02="$GITHUB_WORKSPACE/patches/droidspace/4.19/0002-official-fix-restore-cgroup-file-prefix-handling.patch"
          git apply --check "$P02" && git apply "$P02" || \
            { echo "!! official cgroup patch did not apply; continuing (non-fatal)"; }
          echo "Droidspace 4.19 patches done (config merged below)"

      # LOS lineage-23.2 backported scripts/as-version.sh (upstream
      # "kbuild: check the minimum assembler version in Kconfig") but its
      # companion scripts/min-tool-version.sh never landed in the tree;
      # Kconfig.include calls as-version.sh during alldefconfig and fails
      # on the missing file. Drop the v5.15 upstream file in before the
      # defconfig stage (binutils floor 2.23.0 — far below the runner's
      # binutils, so the check passes once the file exists).
      - name: Restore missing scripts/min-tool-version.sh (LOS tree gap)
        run: |
          cd "$KROOT"
          if [ -f scripts/min-tool-version.sh ]; then
            echo "scripts/min-tool-version.sh already present"
          else
            cp "$GITHUB_WORKSPACE/patches/alioth/min-tool-version.sh" scripts/
            chmod +x scripts/min-tool-version.sh
            echo "restored scripts/min-tool-version.sh"
          fi

      # Commit all applied patches so `make`'s setlocalversion sees a clean
      # git tree -> kernel version loses the "-dirty" suffix while keeping
      # the git describe commit id.
      - name: Commit patched kernel tree (drop -dirty from version)
        run: |
          cd "$KROOT"
          git config user.email "action@localhost"
          git config user.name "kernel-builder"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit (clean tree)"
          else
            git commit -q -m "apply MVNonGKIDevices feature patches (resukisu/bbg/droidspace/susfs)"
            echo "committed patched tree: $(git rev-parse --short HEAD)"
          fi

      - name: Assemble defconfig (kona + alioth + feature fragments)
        run: |
          FRAGS=""
          [ "$ENABLE_RESUKISU" = "true" ] && FRAGS="$FRAGS $GITHUB_WORKSPACE/resukisu.config.fragment"
          [ "$ENABLE_BBG" = "true" ] && FRAGS="$FRAGS $GITHUB_WORKSPACE/bbg.config.fragment"
          [ "$ENABLE_DROIDSPACE" = "true" ] && FRAGS="$FRAGS $GITHUB_WORKSPACE/patches/droidspace/4.19/droidspace.config"
          BASE_DEFCONFIG="arch/arm64/configs/vendor/kona-perf_defconfig" \
          DEVICE_FRAGMENTS="arch/arm64/configs/vendor/debugfs.config arch/arm64/configs/vendor/xiaomi/sm8250-common.config arch/arm64/configs/vendor/xiaomi/alioth.config" \
          ENABLE_RESUKISU="$ENABLE_RESUKISU" \
          ENABLE_BBG="$ENABLE_BBG" \
          ENABLE_DROIDSPACE="$ENABLE_DROIDSPACE" \
          ENABLE_DATA_ISOLATION="$ENABLE_DATA_ISOLATION" \
          HOOK_EXTRA="$HOOK_EXTRA" \
          HOOK_TYPE="$HOOK_TYPE" \
          bash scripts/merge-defconfig.sh "$KROOT" "$RUNNER_TEMP/out" $FRAGS


      - name: Build kernel Image and dtbo.img
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/logs"
          export PATH="$CLANG_DIR:$PATH"
          export KBUILD_BUILD_HOST=build
          export KBUILD_BUILD_USER=kernel
          cd "$KROOT"
          # 4.19 kona tree: LLVM=1 clang build (official android-4.19 flow).
          # Image (not Image.gz-dtb): dtb lives in the separate dtbo.img
          # (CONFIG_BUILD_ARM64_DT_OVERLAY=y); build the device-tree
          # overlays explicitly (make dtbs), then assemble dtbo.img.
          make -j"$(nproc)" O="$RUNNER_TEMP/out" ARCH=arm64 \
            CC="clang" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            CROSS_COMPILE="$RUNNER_TEMP/tc/gcc64/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="$RUNNER_TEMP/tc/gcc32/bin/arm-linux-androideabi-" \
            LD=ld.lld LLVM=1 LLVM_IAS=1 \
            Image \
            2>&1 | tee "$GITHUB_WORKSPACE/logs/build.log"
          rc=${PIPESTATUS[0]}
          # device-tree overlays (needed for dtbo.img)
          if [ "$rc" = 0 ]; then
            make O="$RUNNER_TEMP/out" ARCH=arm64 \
              CC="clang" CLANG_TRIPLE="aarch64-linux-gnu-" \
              CROSS_COMPILE="$RUNNER_TEMP/tc/gcc64/bin/aarch64-linux-android-" \
              CROSS_COMPILE_ARM32="$RUNNER_TEMP/tc/gcc32/bin/arm-linux-androideabi-" \
              LD=ld.lld LLVM=1 LLVM_IAS=1 \
              dtbs >> "$GITHUB_WORKSPACE/logs/build.log" 2>&1
            rc=${PIPESTATUS[0]}
          fi
          cp -f "$RUNNER_TEMP/out/.config" "$GITHUB_WORKSPACE/logs/final.config" 2>/dev/null || true
          # kernel image
          cp -f "$RUNNER_TEMP/out/arch/arm64/boot/Image" "$RUNNER_TEMP/out/Image" 2>/dev/null || true
          [ -f "$RUNNER_TEMP/out/arch/arm64/boot/Image" ] || { echo "Image not produced"; rc=1; }
          if [ "$rc" != 0 ]; then
            { echo "### build kernel FAILED (rc=$rc)"; tail -100 "$GITHUB_WORKSPACE/logs/build.log"; } >> "$GITHUB_STEP_SUMMARY" || true
            exit "$rc"
          fi
          { echo "### build kernel OK"; tail -20 "$GITHUB_WORKSPACE/logs/build.log"; } >> "$GITHUB_STEP_SUMMARY" || true
          # dtbo.img: mkdtboimg (AOSP libufdt) from the alioth overlay dtbo.
          # The kona dts Makefile builds alioth-sm8250-overlay.dtbo (base
          # kona.dtb); LOS assembles dtbo.img out-of-tree with mkdtimg.
          if [ -f "$RUNNER_TEMP/out/arch/arm64/boot/dts/vendor/qcom/alioth-sm8250-overlay.dtbo" ]; then
            curl -sL --max-time 60 \
              "https://android.googlesource.com/platform/system/libufdt/+/refs/heads/main/utils/src/mkdtboimg.py?format=TEXT" \
              -o "$RUNNER_TEMP/mkdtboimg.py.b64"
            base64 -d "$RUNNER_TEMP/mkdtboimg.py.b64" > "$RUNNER_TEMP/mkdtboimg.py"
            python3 "$RUNNER_TEMP/mkdtboimg.py" create "$RUNNER_TEMP/dtbo.img" \
              --page_size=4096 \
              "$RUNNER_TEMP/out/arch/arm64/boot/dts/vendor/qcom/alioth-sm8250-overlay.dtbo" \
              && echo "dtbo.img assembled" || echo "dtbo.img assembly failed (non-fatal)"
          else
            echo "alioth overlay dtbo not found; dtbo.img not produced (non-fatal)"
          fi

      - name: Package AnyKernel3 zip
        run: |
          rm -rf "$RUNNER_TEMP/ak3"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git \
            "$RUNNER_TEMP/ak3"
          rm -rf "$RUNNER_TEMP/ak3/.git" "$RUNNER_TEMP/ak3/.github" \
                 "$RUNNER_TEMP/ak3/.gitignore" "$RUNNER_TEMP/ak3/.gitattributes"
          # --- alioth (Redmi K40 / POCO F3) settings ---
          # virtual A/B device: kernel Image goes to the boot partition of
          # the current slot; dtbo.img (if produced) is flashed by AK3's
          # flash_generic dtbo from the zip root.
          FEATS=""
          if [ "$ENABLE_RESUKISU" = "true" ]; then
            if [ "$HOOK_TYPE" = "auto" ]; then
              FEATS="$FEATS ResukiSU-AutoHook"
            else
              FEATS="$FEATS ResukiSU"
            fi
          fi
          [ "$ENABLE_BBG" = "true" ] && FEATS="$FEATS BBG"
          [ "$ENABLE_DROIDSPACE" = "true" ] && FEATS="$FEATS Droidspace"
          [ -z "$FEATS" ] && FEATS=" Stock"
          sed -i "s/^\(\s*\)kernel.string=.*/\1kernel.string=K40${FEATS} Kernel/" "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s/^\(\s*\)device.name1=.*/\1device.name1=alioth/"          "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s/^\(\s*\)device.name2=.*/\1device.name2=/"                 "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s/^\(\s*\)device.name3=.*/\1device.name3=/"                 "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s/^\(\s*\)device.name4=.*/\1device.name4=/"                 "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s|^BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|"    "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/"                   "$RUNNER_TEMP/ak3/anykernel.sh"
          # boot image header v3 (virtual A/B): AK3 handles hdr v3 boot
          # partitions (kernel only, ramdisk lives in vendor_boot).
          cp "$RUNNER_TEMP/out/Image" "$RUNNER_TEMP/ak3/"
          [ -f "$RUNNER_TEMP/dtbo.img" ] && cp "$RUNNER_TEMP/dtbo.img" "$RUNNER_TEMP/ak3/"
          ( cd "$RUNNER_TEMP/ak3" && zip -r9 "$RUNNER_TEMP/alioth-kernel.zip" . >/dev/null )

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build.log
          path: ${{ github.workspace }}/logs/build.log
          archive: false
          if-no-files-found: warn
          retention-days: 14

      - name: Upload kernel image
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Image
          path: ${{ runner.temp }}/out/Image
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload dtbo image
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: dtbo.img
          path: ${{ runner.temp }}/dtbo.img
          archive: false
          if-no-files-found: warn
          retention-days: 14

      - name: Upload AnyKernel3 package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: alioth-kernel.zip
          path: ${{ runner.temp }}/alioth-kernel.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
