name: build-alioth

# Builds a Xiaomi Redmi K40 / POCO F3 (alioth, sm8250/kona) kernel from
# MOSSVENC's fork of the LineageOS 4.19 kernel with selectable features
# (ReSukiSU hook modes / BBG / Droidspace 4.19 / SuSFS 4.19 via the
# test-tree reference) and packages it as an AnyKernel3 zip.
#
# Kernel: 4.19.325 (arch/arm64, CAF kona), boot image header v3 on a
# virtual-A/B device; kernel Image goes to the boot partition and the
# device-tree overlays live in a separate dtbo.img (see packaging step).
#
# Feature defaults mirror the workflow_dispatch input defaults below.

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: kernel branch/ref to build
        required: false
        default: lineage-23.2
      root_mode:
        description: "root manager & hook mode: see README section \"root_mode\""
        type: choice
        options:
          - resukisu-manual-lsm
          - resukisu-manual-source
          - resukisu-auto
          - resukisu-susfs
          - xxksu-syscall_table
          - xxksu-branch_link
          - none
        default: none
      enable_bbg:
        description: integrate Baseband-guard (BBG)
        type: boolean
        default: false
      enable_droidspace:
        description: enable Droidspaces/LXC kernel support (4.19)
        type: boolean
        default: false
      auto_fix_49:
        description: "4.x auto-hook kasan_reset_tag guard fix (resukisu-auto)"
        type: boolean
        default: false

concurrency:
  group: alioth-kernel
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      # workflow_dispatch inputs are empty on push-triggered runs, so every
      # option falls back to a default (lineage-23.2 + all features on).
      KERNEL_REF: ${{ inputs.kernel_ref || 'lineage-23.2' }}
      KERNEL_REPO: https://github.com/MOSSVENC/android_kernel_xiaomi_sm8250.git
      ROOT_MANAGER: ${{ startsWith(inputs.root_mode, 'resukisu') && 'resukisu' || startsWith(inputs.root_mode, 'xxksu') && 'xxksu' || 'none' }}
      ENABLE_BBG: ${{ inputs.enable_bbg }}
      ENABLE_DROIDSPACE: ${{ inputs.enable_droidspace }}
      ENABLE_DATA_ISOLATION: "false"   # sdcardfs data isolation is a 4.9 sdm845 feature
      HOOK_TYPE: ${{ endsWith(inputs.root_mode, '-auto') && 'auto' || endsWith(inputs.root_mode, '-susfs') && 'susfs' || endsWith(inputs.root_mode, '-syscall_table') && 'syscall_table' || endsWith(inputs.root_mode, '-branch_link') && 'branch_link' || startsWith(inputs.root_mode, 'resukisu') && 'manual' || 'none' }}
      HOOK_EXTRA: ${{ endsWith(inputs.root_mode, '-manual-source') && 'manual' || endsWith(inputs.root_mode, '-manual-lsm') && 'lsm' || '' }}
      AUTO_FIX_49: ${{ inputs.auto_fix_49 }}
    steps:
      - name: Checkout action repo
        uses: actions/checkout@v7

      # Unified toolchain across all supported devices: AOSP clang 14
      # (clang-r450784d from android13-release) + Android GCC 4.9 prebuilt
      # binutils. The 4.19 tree is built with LLVM=1, 复用本仓库 4.9 设备
      # 的工具链配方（与官方 android-4.19 build.config 的 LLVM=1 一致）。
      - name: Start full log
        run: |
          mkdir -p "$GITHUB_WORKSPACE/logs"
          LOG="$GITHUB_WORKSPACE/logs/alioth-full.log"
          : > "$LOG"
          ENVF="$GITHUB_WORKSPACE/logs/bash_env.sh"
          {
            [ -n "${BASH_ENV:-}" ] && printf '[ -f %q ] && source %q\n' "$BASH_ENV" "$BASH_ENV"
            printf 'exec > >(tee -a %q) 2>&1\n' "$LOG"
          } > "$ENVF"
          echo "BASH_ENV=$ENVF" >> "$GITHUB_ENV"
          echo "full log: $LOG"

      - name: Install binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip curl bc bison flex libssl-dev make \
            libncurses-dev python3 python3-pip \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Download AOSP clang 14 + GCC 4.9 binutils
        run: |
          mkdir -p "$RUNNER_TEMP/tc"
          git clone -q --depth=1 --single-branch \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            -b android13-release "$RUNNER_TEMP/tc/clang"
          CLANG_BIN="$RUNNER_TEMP/tc/clang/clang-r450784d/bin"
          ls "$CLANG_BIN/clang" >/dev/null
          echo "CLANG_DIR=$CLANG_BIN" >> "$GITHUB_ENV"
          git clone -q --depth=1 --single-branch \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            -b android12L-release "$RUNNER_TEMP/tc/gcc64"
          git clone -q --depth=1 --single-branch \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            -b android12L-release "$RUNNER_TEMP/tc/gcc32"
          echo "$RUNNER_TEMP/tc/gcc64/bin:$RUNNER_TEMP/tc/gcc32/bin:$CLANG_BIN" >> "$GITHUB_PATH"

      - name: Clone kernel source (not part of this repo)
        run: |
          set -o pipefail
          git config --global http.postBuffer 524288000
          git clone --depth=1 --filter=blob:none \
            --branch="$KERNEL_REF" \
            "$KERNEL_REPO" \
            "$RUNNER_TEMP/kernel" 2>&1 | tee /tmp/clone.log
          echo "KROOT=$RUNNER_TEMP/kernel" >> "$GITHUB_ENV"
          head -6 "$RUNNER_TEMP/kernel/Makefile"
          { echo "### kernel clone"; tail -40 /tmp/clone.log; } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Apply ReSukiSU manual-hook patches
        if: env.ROOT_MANAGER == 'resukisu' && env.HOOK_TYPE != 'auto' && env.HOOK_TYPE != 'susfs'
        run: |
          # File-level list: shared shapes (stat/exec/reboot/input) live
          # in resukisu/4.9 as the single copy; 4.19-local files cover the
          # 4.19-shaped parts (faccessat wrapper, __sys setresuid, ksys_read
          # wrapper).
          PATCHES="$GITHUB_WORKSPACE/patches/resukisu/4.9/0001-fs-stat-ksu-manual-hook.patch"
          PATCHES="$PATCHES $GITHUB_WORKSPACE/patches/resukisu/4.9/0002-fs-exec-ksu-manual-hook.patch"
          PATCHES="$PATCHES $GITHUB_WORKSPACE/patches/resukisu/4.19/0003-fs-open-ksu-manual-hook.patch"
          PATCHES="$PATCHES $GITHUB_WORKSPACE/patches/resukisu/4.9/0004-kernel-reboot-ksu-manual-hook.patch"
          if [ "$HOOK_EXTRA" = "manual" ]; then
            echo "hook_extra=manual: also applying alt manual hooks (input/setuid/sys_read)"
            PATCHES="$PATCHES $GITHUB_WORKSPACE/patches/resukisu/4.9/0010-input-manual-hook.patch"
            PATCHES="$PATCHES $GITHUB_WORKSPACE/patches/resukisu/4.19/0011-setuid-manual-hook.patch"
            PATCHES="$PATCHES $GITHUB_WORKSPACE/patches/resukisu/4.19/0012-sysread-manual-hook.patch"
          else
            echo "hook_extra=lsm: alt hooks handled by LSM/input_handler AUTO machinery"
          fi
          bash scripts/apply-patches.sh "$KROOT" $PATCHES

      - name: Integrate ReSukiSU (kernel/setup.sh + config fragment)
        if: env.ROOT_MANAGER == 'resukisu'
        run: |
          bash scripts/integrate-resukisu.sh "$KROOT" \
            "$GITHUB_WORKSPACE/resukisu.config.fragment" "$HOOK_EXTRA" "$HOOK_TYPE" "$AUTO_FIX_49"

      # SuSFS 4.19 kernel-side port from the test-tree 5.10->4.19 pipeline,
      # applied AFTER ReSukiSU setup.sh (hook_mode=susfs).
      # --- XXKSU (root_mode=xxksu-*): Backslashxx KernelSU fork ---
      # Fork hook types (syscall_table / branch_link) handle the sucompat
      # call sites itself: no manual source patches, no inline-hook
      # generator. Layout mirrors the ReSukiSU setup (KernelSU/kernel
      # symlinked as drivers/kernelsu). Tracks the fork master branch.
      - name: Integrate XXKSU kernel (Backslashxx fork)
        if: env.ROOT_MANAGER == 'xxksu'
        run: |
          git clone -q --depth=1 --single-branch \
            --branch=master \
            https://github.com/Backslashxx/KernelSU "$RUNNER_TEMP/xxksu"
          # 4.x kconfig has no '=' comparison; the LKM-only default line
          # would abort alldefconfig. In-tree KSU=y is set by the fragment.
          sed -i '/default y if KSU = m/d' "$RUNNER_TEMP/xxksu/kernel/Kconfig"
          cd "$KROOT"
          mkdir -p KernelSU
          ln -sfn "$RUNNER_TEMP/xxksu/kernel" KernelSU/kernel
          # absolute target: a relative link would resolve under drivers/
          ln -sfn "$RUNNER_TEMP/xxksu/kernel" drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || \
            sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig
          # Hook engines are mutually exclusive at the Kconfig level
          # (KSU_HACK_ARM64_BRANCH_LINK depends on !KSU_TAMPER_SYSCALL_TABLE).
          case "$HOOK_TYPE" in
            branch_link) ENGINE=branch_link ;;
            syscall_table) ENGINE=syscall_table ;;
            *) ENGINE=none ;;
          esac
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_LSM_SECURITY_HOOKS=y"
            case "$ENGINE" in
              branch_link)
                echo "CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y"
                echo "# CONFIG_KSU_TAMPER_SYSCALL_TABLE is not set"
                ;;
              syscall_table)
                echo "CONFIG_KSU_TAMPER_SYSCALL_TABLE=y"
                echo "# CONFIG_KSU_HACK_ARM64_BRANCH_LINK is not set"
                ;;
              *)
                echo "# CONFIG_KSU_TAMPER_SYSCALL_TABLE is not set"
                echo "# CONFIG_KSU_HACK_ARM64_BRANCH_LINK is not set"
                ;;
            esac
          } > "$GITHUB_WORKSPACE/xxksu.config.fragment"
          echo "xxksu mode: $HOOK_TYPE engine: $ENGINE"
          cat "$GITHUB_WORKSPACE/xxksu.config.fragment"

      - name: Apply SuSFS 4.19 port (root_mode=resukisu-susfs)
        if: env.ROOT_MANAGER == 'resukisu' && env.HOOK_TYPE == 'susfs'
        run: |
          cd "$KROOT"
          P="$GITHUB_WORKSPACE/patches/susfs/4.19/susfs-port.patch"
          git apply --check "$P" || { echo "test patch does not apply cleanly"; exit 1; }
          git apply "$P"
          echo "SuSFS 4.19 port applied:"
          grep -c 'CONFIG_KSU_SUSFS' fs/susfs.c include/linux/susfs.h
          # ReSukiSU's inline_hook_check.mk requires the ksu_handle_* call
          # sites (setresuid/execveat/faccessat/sys_read/stat/reboot/input)
          # in the kernel sources when using the SuSFS inline hook; the port
          # carries all of them for this tree.
          # verify the faces ReSukiSU's inline_hook_check.mk demands
          MISSING=""
          for spec in "ksu_handle_setresuid:kernel/sys.c" "ksu_handle_execveat:fs/exec.c" \
                      "ksu_handle_post_execveat_sucompat:fs/exec.c" \
                      "ksu_handle_faccessat:fs/open.c" "ksu_handle_sys_read:fs/read_write.c" \
                      "ksu_handle_stat:fs/stat.c" "ksu_handle_vfs_fstat:fs/stat.c" \
                      "ksu_handle_sys_reboot:kernel/reboot.c" \
                      "ksu_handle_input_handle_event:drivers/input/input.c"; do
            sym="${spec%%:*}"; file="${spec##*:}"
            grep -q "$sym" "$file" || MISSING="$MISSING $sym($file)"
          done
          # the post-execve call must sit after the exec attempt
          post=$(grep -n '(void)ksu_handle_post_execveat_sucompat(' fs/exec.c | head -1 | cut -d: -f1)
          done_line=$(grep -n 'exec_binprm(bprm)' fs/exec.c | head -1 | cut -d: -f1)
          [ -n "$post" ] && [ -n "$done_line" ] && [ "$post" -gt "$done_line" ] || {
            echo "post-execve call not after the exec attempt (post=$post exec=$done_line)" >&2
            exit 1; }
          # fs/open.c and fs/stat.c call filename_lookup(); the port
          # de-statics it for the 4.x tree
          grep -q '^int filename_lookup' fs/namei.c || MISSING="$MISSING filename_lookup(fs/namei.c)"
          if [ -n "$MISSING" ]; then
            echo "port left missing:$MISSING" >&2
            exit 1
          fi
          echo "SuSFS KSU-interaction hooks present"

      - name: Integrate Baseband-guard (BBG)
        if: env.ENABLE_BBG == 'true'
        run: |
          bash scripts/integrate-bbg.sh "$KROOT" \
            "$GITHUB_WORKSPACE/bbg.config.fragment"

      - name: Integrate Droidspace (patch + config)
        if: env.ENABLE_DROIDSPACE == 'true'
        run: |
          # Official non-GKI patch 2/2 (cgroup prefix symlink) applies
          # as-is on the 4.19 kona tree; patch 1/2 (xt_qtaguid) is a
          # no-op here because LOS sm8250 has no qtaguid — skip it.
          cd "$KROOT"
          P02="$GITHUB_WORKSPACE/patches/droidspace/official/0002-official-fix-restore-cgroup-file-prefix-handling.patch"
          git apply --check "$P02" && git apply "$P02" || \
            { echo "!! official cgroup patch did not apply; continuing (non-fatal)"; }
          echo "Droidspace 4.19 patches done (config merged below)"

      # LOS lineage-23.2 backported scripts/as-version.sh (upstream
      # "kbuild: check the minimum assembler version in Kconfig") but its
      # companion scripts/min-tool-version.sh never landed in the tree;
      # Kconfig.include calls as-version.sh during alldefconfig and fails
      # on the missing file. Drop the v5.15 upstream file in before the
      # defconfig stage (binutils floor 2.23.0 — far below the runner's
      # binutils, so the check passes once the file exists).
      - name: Restore missing scripts/min-tool-version.sh (LOS tree gap)
        run: |
          cd "$KROOT"
          if [ -f scripts/min-tool-version.sh ]; then
            echo "scripts/min-tool-version.sh already present"
          else
            cp "$GITHUB_WORKSPACE/patches/alioth/min-tool-version.sh" scripts/
            chmod +x scripts/min-tool-version.sh
            echo "restored scripts/min-tool-version.sh"
          fi

      # Commit all applied patches so `make`'s setlocalversion sees a clean
      # git tree -> kernel version loses the "-dirty" suffix while keeping
      # the git describe commit id.
      - name: Commit patched kernel tree (drop -dirty from version)
        run: |
          cd "$KROOT"
          git config user.email "action@localhost"
          git config user.name "kernel-builder"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit (clean tree)"
          else
            git commit -q -m "apply MVNonGKIDevices feature patches (resukisu/bbg/droidspace/susfs)"
            echo "committed patched tree: $(git rev-parse --short HEAD)"
          fi

      - name: Assemble defconfig (baseline + feature fragments)
        run: |
          FRAGS=""
          if [ "$ROOT_MANAGER" = "resukisu" ]; then
            FRAGS="$FRAGS $GITHUB_WORKSPACE/resukisu.config.fragment"
          elif [ "$ROOT_MANAGER" = "xxksu" ]; then
            FRAGS="$FRAGS $GITHUB_WORKSPACE/xxksu.config.fragment"
          fi
          [ "$ENABLE_BBG" = "true" ] && FRAGS="$FRAGS $GITHUB_WORKSPACE/bbg.config.fragment"
          [ "$ENABLE_DROIDSPACE" = "true" ] && FRAGS="$FRAGS $GITHUB_WORKSPACE/patches/droidspace/4.19/droidspace.config"
          BASE_DEFCONFIG="arch/arm64/configs/vendor/kona-perf_defconfig" \
          DEVICE_FRAGMENTS="arch/arm64/configs/vendor/debugfs.config arch/arm64/configs/vendor/xiaomi/sm8250-common.config arch/arm64/configs/vendor/xiaomi/alioth.config" \
          ROOT_MANAGER="$ROOT_MANAGER" \
          ENABLE_BBG="$ENABLE_BBG" \
          ENABLE_DROIDSPACE="$ENABLE_DROIDSPACE" \
          ENABLE_DATA_ISOLATION="$ENABLE_DATA_ISOLATION" \
          HOOK_EXTRA="$HOOK_EXTRA" \
          HOOK_TYPE="$HOOK_TYPE" \
          bash scripts/merge-defconfig.sh "$KROOT" "$RUNNER_TEMP/out" $FRAGS


      - name: Build kernel Image and dtbo.img
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/logs"
          export PATH="$CLANG_DIR:$PATH"
          export KBUILD_BUILD_HOST=build
          export KBUILD_BUILD_USER=kernel
          cd "$KROOT"
          # 4.19 kona tree: LLVM=1 clang build (official android-4.19 flow).
          # Image (not Image.gz-dtb): dtb lives in the separate dtbo.img
          # (CONFIG_BUILD_ARM64_DT_OVERLAY=y); build the device-tree
          # overlays explicitly (make dtbs), then assemble dtbo.img.
          rc=0
          make -j"$(nproc)" O="$RUNNER_TEMP/out" ARCH=arm64 \
            CC="clang" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            CROSS_COMPILE="$RUNNER_TEMP/tc/gcc64/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="$RUNNER_TEMP/tc/gcc32/bin/arm-linux-androideabi-" \
            LD=ld.lld LLVM=1 LLVM_IAS=1 \
            Image \
            2>&1 || rc=$?
          # device-tree overlays (needed for dtbo.img)
          if [ "$rc" = 0 ]; then
            make O="$RUNNER_TEMP/out" ARCH=arm64 \
              CC="clang" CLANG_TRIPLE="aarch64-linux-gnu-" \
              CROSS_COMPILE="$RUNNER_TEMP/tc/gcc64/bin/aarch64-linux-android-" \
              CROSS_COMPILE_ARM32="$RUNNER_TEMP/tc/gcc32/bin/arm-linux-androideabi-" \
              LD=ld.lld LLVM=1 LLVM_IAS=1 \
              dtbs 2>&1 || rc=$?
          fi
          cp -f "$RUNNER_TEMP/out/.config" "$GITHUB_WORKSPACE/logs/final.config" 2>/dev/null || true
          # kernel image
          cp -f "$RUNNER_TEMP/out/arch/arm64/boot/Image" "$RUNNER_TEMP/out/Image" 2>/dev/null || true
          [ -f "$RUNNER_TEMP/out/arch/arm64/boot/Image" ] || { echo "Image not produced"; rc=1; }
          if [ "$rc" != 0 ]; then
            { echo "### build kernel FAILED (rc=$rc)"; tail -100 "$GITHUB_WORKSPACE/logs/alioth-full.log"; } >> "$GITHUB_STEP_SUMMARY" || true
            exit "$rc"
          fi
          { echo "### build kernel OK"; tail -20 "$GITHUB_WORKSPACE/logs/alioth-full.log"; } >> "$GITHUB_STEP_SUMMARY" || true
          # dtbo.img: mkdtboimg (AOSP libufdt) from ALL xiaomi sm8250
          # overlays, in the dts Makefile order. Verified against the
          # official LOS 23.2 dtbo.img (20260902): 12 entries, one per
          # kona xiaomi device, alioth first (mkdtboimg dump on the
          # official image shows dt_entry_count=12, entry.0 model
          # "xiaomi alioth" ... entry.11 "xiaomi umi"). A dtbo.img with
          # only the alioth overlay would not match the stock partition
          # content.
          DTBO_DIR="$RUNNER_TEMP/out/arch/arm64/boot/dts/vendor/qcom"
          DTBO_LIST="alioth-sm8250-overlay.dtbo apollo-sm8250-overlay.dtbo cas-sm8250-overlay.dtbo cmi-sm8250-overlay.dtbo dagu-sm8250-overlay.dtbo enuma-sm8250-overlay.dtbo elish-sm8250-overlay.dtbo lmi-sm8250-overlay.dtbo munch-sm8250-overlay.dtbo psyche-sm8250-overlay.dtbo thyme-sm8250-overlay.dtbo umi-sm8250-overlay.dtbo"
          missing=""
          for f in $DTBO_LIST; do
            [ -f "$DTBO_DIR/$f" ] || missing="$missing $f"
          done
          if [ -z "$missing" ]; then
            curl -sL --max-time 60 \
              "https://android.googlesource.com/platform/system/libufdt/+/refs/heads/main/utils/src/mkdtboimg.py?format=TEXT" \
              -o "$RUNNER_TEMP/mkdtboimg.py.b64"
            base64 -d "$RUNNER_TEMP/mkdtboimg.py.b64" > "$RUNNER_TEMP/mkdtboimg.py"
            # shellcheck disable=SC2086
            python3 "$RUNNER_TEMP/mkdtboimg.py" create "$RUNNER_TEMP/dtbo.img" \
              --page_size=4096 \
              $(for f in $DTBO_LIST; do echo "$DTBO_DIR/$f"; done) \
              && echo "dtbo.img assembled ($(echo $DTBO_LIST | wc -w) overlays)" \
              || echo "dtbo.img assembly failed (non-fatal)"
          else
            echo "missing overlays:$missing; dtbo.img not produced (non-fatal)"
          fi

      - name: Package AnyKernel3 zip
        run: |
          rm -rf "$RUNNER_TEMP/ak3"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git \
            "$RUNNER_TEMP/ak3"
          rm -rf "$RUNNER_TEMP/ak3/.git" "$RUNNER_TEMP/ak3/.github" \
                 "$RUNNER_TEMP/ak3/.gitignore" "$RUNNER_TEMP/ak3/.gitattributes"
          # --- alioth (Redmi K40 / POCO F3) settings ---
          # virtual A/B device: kernel Image goes to the boot partition of
          # the current slot; dtbo.img (if produced) is flashed by AK3's
          # flash_generic dtbo from the zip root.
          # per-build display: banner + kernel.string for the flash-time
          # screen, FEATURES.txt inside the zip for inspection
          python3 "$GITHUB_WORKSPACE/scripts/ak3-display.py" \
            "$RUNNER_TEMP/ak3" "alioth" \
            "$RUNNER_TEMP/zipname.txt"
          # package name follows this build's inputs
          # (codename_manager_hook_feature...)
          AK3_ZIP="$(cat "$RUNNER_TEMP/zipname.txt")"
          echo "AK3_ZIP=$AK3_ZIP" >> "$GITHUB_ENV"
          echo "=== K40 kernel features (this build) ==="
          cat "$RUNNER_TEMP/ak3/FEATURES.txt"

          sed -i "s/^\(\s*\)device.name1=.*/\1device.name1=alioth/"          "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s/^\(\s*\)device.name2=.*/\1device.name2=/"                 "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s/^\(\s*\)device.name3=.*/\1device.name3=/"                 "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s/^\(\s*\)device.name4=.*/\1device.name4=/"                 "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s|^BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|"    "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/"                   "$RUNNER_TEMP/ak3/anykernel.sh"
          # boot image header v3 (virtual A/B): AK3 handles hdr v3 boot
          # partitions (kernel only, ramdisk lives in vendor_boot).
          cp "$RUNNER_TEMP/out/Image" "$RUNNER_TEMP/ak3/"
          [ -f "$RUNNER_TEMP/dtbo.img" ] && cp "$RUNNER_TEMP/dtbo.img" "$RUNNER_TEMP/ak3/"
          ( cd "$RUNNER_TEMP/ak3" && zip -r9 "$RUNNER_TEMP/$AK3_ZIP" . >/dev/null )

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alioth-full.log
          path: ${{ github.workspace }}/logs/alioth-full.log
          archive: false
          if-no-files-found: warn
          retention-days: 14

      - name: Upload kernel image
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Image
          path: ${{ runner.temp }}/out/Image
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload dtbo image
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: dtbo.img
          path: ${{ runner.temp }}/dtbo.img
          archive: false
          if-no-files-found: warn
          retention-days: 14

      - name: Upload AnyKernel3 package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.AK3_ZIP }}
          path: ${{ runner.temp }}/${{ env.AK3_ZIP }}
          archive: false
          if-no-files-found: error
          retention-days: 14
