name: build-daisy

# Builds a Xiaomi Mi A2 Lite (daisy, msm8953) kernel from Flyme66's clean
# "lineage-20" tree with selectable features (ReSukiSU manual hook / BBG /
# Droidspace) and packages it as an AnyKernel3 zip.
# Mirrors build-polaris.yml; differences:
#   - kernel source: Flyme66/android_kernel_xiaomi_msm8953_ItsVixano_daisy @ lineage-20
#   - baseline defconfig: msm8953-perf_defconfig (complete, no fragments)
#   - device is A/B (slot)
# Feature defaults mirror the workflow_dispatch input defaults below.

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: kernel branch/ref to build
        required: false
        default: lineage-20
      root_mode:
        description: "root manager & hook mode: see README section \"root_mode\""
        type: choice
        options:
          - resukisu-manual-lsm
          - resukisu-manual-source
          - resukisu-auto
          - resukisu-susfs
          - xxksu-syscall_table
          - xxksu-branch_link
          - none
        default: none
      localversion:
        description: "custom version string, written verbatim into uname -r (e.g. -MyKernel)"
        type: string
        default: ""
      build_time:
        description: "custom build time for the uname -v date field (e.g. Tue, 08 Sep 2026 21:01:02 +0000)"
        type: string
        default: ""
      enable_bbg:
        description: integrate Baseband-guard (BBG)
        type: boolean
        default: false
      enable_droidspace:
        description: enable Droidspaces/LXC kernel support
        type: boolean
        default: false
      cgroup_port:
        description: 4.9 cgroup noprefix compat patch (droidspace)
        type: boolean
        default: false
      auto_fix_49:
        description: "4.x auto-hook kasan_reset_tag guard fix (resukisu-auto)"
        type: boolean
        default: false

concurrency:
  group: daisy-kernel
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      # workflow_dispatch inputs are empty on push-triggered runs, so every
      # option falls back to a default (thirteen + all features on).
      KERNEL_REF: ${{ inputs.kernel_ref || 'lineage-20' }}
      KERNEL_REPO: https://github.com/Flyme66/android_kernel_xiaomi_msm8953_ItsVixano_daisy.git
      DEFCONFIG: msm8953-perf_defconfig
      HOOK_MODE: ${{ inputs.root_mode || 'none' }}
      ROOT_MANAGER: ${{ startsWith(inputs.root_mode, 'resukisu') && 'resukisu' || startsWith(inputs.root_mode, 'xxksu') && 'xxksu' || 'none' }}
      ENABLE_BBG: ${{ inputs.enable_bbg }}
      ENABLE_DROIDSPACE: ${{ inputs.enable_droidspace }}
      CGROUP_PORT: ${{ inputs.cgroup_port }}
      ENABLE_DATA_ISOLATION: "false"   # sdcardfs data isolation is polaris-specific
      HOOK_TYPE: ${{ endsWith(inputs.root_mode, '-auto') && 'auto' || endsWith(inputs.root_mode, '-susfs') && 'susfs' || endsWith(inputs.root_mode, '-syscall_table') && 'syscall_table' || endsWith(inputs.root_mode, '-branch_link') && 'branch_link' || startsWith(inputs.root_mode, 'resukisu') && 'manual' || 'none' }}
      HOOK_EXTRA: ${{ endsWith(inputs.root_mode, '-manual-source') && 'manual' || endsWith(inputs.root_mode, '-manual-lsm') && 'lsm' || '' }}
      CUSTOM_LOCALVERSION: ${{ inputs.localversion }}
      CUSTOM_BUILD_TIME: ${{ inputs.build_time }}
      TZ: UTC
      AUTO_FIX_49: ${{ inputs.auto_fix_49 }}
    steps:
      - name: Checkout action repo
        uses: actions/checkout@v7

      # NOTE: no "Free disk space" step — it intermittently stalls on some
      # runners for many minutes; our build fits in the runner's disk.

      # Toolchain: AOSP clang 14 (clang-r450784d from android13-release)
      # + system binutils, matching the maintainer's official flow.
      - name: Start full log
        run: bash scripts/full-log.sh daisy

      - name: Install binutils
        run: bash scripts/install-binutils.sh

      - name: Download AOSP clang 14 + GCC 4.9 binutils
        run: bash scripts/download-toolchain.sh clang-r450784d android13-release --gcc32

      - name: Clone kernel source (not part of this repo)
        run: |
          set -o pipefail
          git config --global http.postBuffer 524288000
          # partial clone: fetch commit+tree first, blobs fetched lazily in
          # batches — avoids GitHub's single-pack transfer limit on 1.5GB repos
          git clone --depth=1 --filter=blob:none \
            --branch="$KERNEL_REF" \
            "$KERNEL_REPO" \
            "$RUNNER_TEMP/kernel" 2>&1 | tee /tmp/clone.log
          echo "KROOT=$RUNNER_TEMP/kernel" >> "$GITHUB_ENV"
          head -6 "$RUNNER_TEMP/kernel/Makefile"
          # surface errors via step summary (readable through the API)
          { echo "### kernel clone"; tail -40 /tmp/clone.log; } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Apply ReSukiSU manual-hook patches
        if: env.ROOT_MANAGER == 'resukisu' && env.HOOK_TYPE != 'auto' && env.HOOK_TYPE != 'susfs'
        run: |
          # NOTE: pass ABSOLUTE patch-dir paths — apply-patches.sh cd's into
          # the kernel root, so relative paths would not resolve.
          C="$GITHUB_WORKSPACE/patches/resukisu/4.9"
          # daisy tree has its own reboot.c context (pullDownReset guard) —
          # use the daisy-specific 0004, not common/0004.
          PATCHES="$C/0001-fs-stat-ksu-manual-hook.patch $C/0002-fs-exec-ksu-manual-hook.patch $C/0003-fs-open-ksu-manual-hook.patch $C/daisy/0004-kernel-reboot-ksu-manual-hook.patch"
          if [ "$HOOK_EXTRA" = "manual" ]; then
            echo "hook_extra=manual: also applying alt manual hooks (input/setuid/sys_read)"
            PATCHES="$PATCHES $(ls $C/001[0-2]-*.patch | sort)"
          else
            echo "hook_extra=lsm: alt hooks handled by LSM/input_handler AUTO machinery"
          fi
          bash scripts/apply-patches.sh "$KROOT" $PATCHES

      - name: Integrate ReSukiSU (kernel/setup.sh + config fragment)
        if: env.ROOT_MANAGER == 'resukisu'
        run: |
          bash scripts/integrate-resukisu.sh "$KROOT" \
            "$GITHUB_WORKSPACE/resukisu.config.fragment" "$HOOK_EXTRA" "$HOOK_TYPE" "$AUTO_FIX_49"

      # SuSFS kernel-side port from the test-tree daisy reference, applied
      # AFTER ReSukiSU setup.sh (hook_mode=susfs).
      # --- XXKSU (root_mode=xxksu-*): Backslashxx KernelSU fork ---
      # Fork hook types (syscall_table / branch_link) handle the sucompat
      # call sites itself: no manual source patches, no inline-hook
      # generator. Layout mirrors the ReSukiSU setup (KernelSU/kernel
      # symlinked as drivers/kernelsu). Tracks the fork master branch.
      - name: Integrate XXKSU kernel (Backslashxx fork)
        if: env.ROOT_MANAGER == 'xxksu'
        run: bash scripts/integrate-xxksu.sh "$KROOT"

      - name: Apply SuSFS 4.9 port (root_mode=resukisu-susfs)
        if: env.ROOT_MANAGER == 'resukisu' && env.HOOK_TYPE == 'susfs'
        run: bash scripts/apply-susfs-port.sh "$KROOT" "$GITHUB_WORKSPACE/patches/susfs/4.9/daisy/susfs-port.patch"

      - name: Integrate Baseband-guard (BBG)
        if: env.ENABLE_BBG == 'true'
        run: |
          # Upstream setup.sh wires security/baseband-guard and, on these
          # pre-5.1 trees (no DEFINE_LSM), patches security/selinux
          # (Makefile + objsec.h bbg_cred). Fragment carries CONFIG_BBG=y;
          # merge-defconfig.sh asserts it.
          bash "$GITHUB_WORKSPACE/scripts/integrate-bbg.sh" "$KROOT" \
            "$GITHUB_WORKSPACE/bbg.config.fragment"

      - name: Integrate Droidspace (patch + config)
        if: env.ENABLE_DROIDSPACE == 'true'
        run: |
          PORT=""
          if [ "$CGROUP_PORT" = "true" ]; then
            PORT="$GITHUB_WORKSPACE/patches/droidspace/4.9/0001-cgroup-noprefix-4.9-port.patch"
          fi
          bash scripts/integrate-droidspace.sh "$KROOT" "$PORT"

      # Commit all applied patches so `make`'s setlocalversion sees a clean
      # git tree -> kernel version loses the "-dirty" suffix while keeping
      # the git describe commit id (4.9 uses CONFIG_LOCALVERSION_AUTO).
      - name: Commit patched kernel tree (drop -dirty from version)
        run: |
          cd "$KROOT"
          git config user.email "action@localhost"
          git config user.name "kernel-builder"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit (clean tree)"
          else
            git commit -q -m "apply MVNonGKIDevices feature patches (resukisu/bbg/droidspace)"
            echo "committed patched tree: $(git rev-parse --short HEAD)"
          fi

      - name: Assemble defconfig (baseline + feature fragments)
        run: |
          FRAGS=""
          if [ "$ROOT_MANAGER" = "resukisu" ]; then
            FRAGS="$FRAGS $GITHUB_WORKSPACE/resukisu.config.fragment"
          elif [ "$ROOT_MANAGER" = "xxksu" ]; then
            FRAGS="$FRAGS $GITHUB_WORKSPACE/xxksu.config.fragment"
          fi
          [ "$ENABLE_BBG" = "true" ] && FRAGS="$FRAGS $GITHUB_WORKSPACE/bbg.config.fragment"
          [ "$ENABLE_DROIDSPACE" = "true" ] && FRAGS="$FRAGS $GITHUB_WORKSPACE/patches/droidspace/4.9/droidspace.config"
          BASE_DEFCONFIG="arch/arm64/configs/msm8953-perf_defconfig" \
          DEVICE_FRAGMENTS="" \
          CLEAR_LOCALVERSION="false" \
          ROOT_MANAGER="$ROOT_MANAGER" \
          ENABLE_BBG="$ENABLE_BBG" \
          ENABLE_DROIDSPACE="$ENABLE_DROIDSPACE" \
          ENABLE_DATA_ISOLATION="$ENABLE_DATA_ISOLATION" \
          HOOK_EXTRA="$HOOK_EXTRA" \
          HOOK_TYPE="$HOOK_TYPE" \
          CUSTOM_LOCALVERSION="$CUSTOM_LOCALVERSION" \
          bash scripts/merge-defconfig.sh "$KROOT" "$RUNNER_TEMP/out" $FRAGS

      - name: Build kernel Image.gz-dtb
        run: bash scripts/build-kernel.sh daisy Image.gz-dtb

      - name: Package AnyKernel3 zip
        run: |
          rm -rf "$RUNNER_TEMP/ak3"
          # full AnyKernel3 template (anykernel.sh + tools/ak3-core.sh,
          # magiskboot, META-INF ...) — not a hand-rolled minimal layout
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git \
            "$RUNNER_TEMP/ak3"
          # strip VCS/CI cruft so the zip holds only flash-relevant files
          rm -rf "$RUNNER_TEMP/ak3/.git" "$RUNNER_TEMP/ak3/.github" \
                 "$RUNNER_TEMP/ak3/.gitignore" "$RUNNER_TEMP/ak3/.gitattributes"
          # --- daisy (Mi A2 Lite) settings ---
          # device props inside properties() are indented; boot vars at top
          # per-build display: the banner file carries the codename/manager/hook
          # and feature line for the flash screen; FEATURES.txt ships the
          # same line inside the zip
          python3 "$GITHUB_WORKSPACE/scripts/ak3-display.py" \
            "$RUNNER_TEMP/ak3" "daisy" \
            "$RUNNER_TEMP/zipname.txt"
          # package name follows this build's inputs:
          # <codename>_<manager>_<hook>[_<feature>...].zip
          AK3_ZIP="$(cat "$RUNNER_TEMP/zipname.txt")"
          echo "AK3_ZIP=$AK3_ZIP" >> "$GITHUB_ENV"
          echo "=== Daisy kernel features (this build) ==="
          cat "$RUNNER_TEMP/ak3/FEATURES.txt"

          sed -i "s/^\(\s*\)device.name1=.*/\1device.name1=daisy/"       "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s/^\(\s*\)device.name2=.*/\1device.name2=/"                "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s/^\(\s*\)device.name3=.*/\1device.name3=/"                "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s/^\(\s*\)device.name4=.*/\1device.name4=/"                "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s|^BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|"   "$RUNNER_TEMP/ak3/anykernel.sh"
          sed -i "s/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/"                  "$RUNNER_TEMP/ak3/anykernel.sh"
          cp "$RUNNER_TEMP/out/Image.gz-dtb" "$RUNNER_TEMP/ak3/"
          # zip INSIDE ak3/ so the zip root is anykernel.sh/META-INF/tools/
          # (standard AnyKernel3 layout, no extra wrapper directory)
          ( cd "$RUNNER_TEMP/ak3" && zip -r9 "$RUNNER_TEMP/$AK3_ZIP" . >/dev/null )

      # --- three SEPARATE artifacts, never nested/repacked into each other ---
      # 1) raw full-flow log  2) raw kernel image  3) standard AnyKernel3 zip
      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daisy-full.log
          path: ${{ github.workspace }}/logs/daisy-full.log
          archive: false
          if-no-files-found: warn
          retention-days: 14

      - name: Upload kernel image
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Image.gz-dtb
          path: ${{ runner.temp }}/out/Image.gz-dtb
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload final config
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: final.config
          path: ${{ github.workspace }}/logs/final.config
          archive: false
          if-no-files-found: warn
          retention-days: 14

      - name: Post-build summary
        if: always()
        run: |
          { echo "## daisy build (${{ env.DEFCONFIG }}, ${{ env.HOOK_MODE }})"
            echo "- kernel_ref: ${{ env.KERNEL_REF }}"
            echo "- features: mode=$HOOK_MODE manager=$ROOT_MANAGER bbg=$ENABLE_BBG droidspace=$ENABLE_DROIDSPACE"
            echo "- artifacts: Image.gz-dtb / final.config / daisy-full.log"
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload AnyKernel3 package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.AK3_ZIP }}
          path: ${{ runner.temp }}/${{ env.AK3_ZIP }}
          archive: false
          if-no-files-found: error
          retention-days: 14
